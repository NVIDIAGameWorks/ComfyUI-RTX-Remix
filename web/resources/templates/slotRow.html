<template id="rtx-remix-slot-row-template">
  <tr draggable="true" class="rtx-remix-draggable-row">
    <td class="rtx-remix-drag-handle">
      <span class="rtx-remix-drag-icon">⋮⋮</span>
    </td>
    <td>
      <span class="rtx-remix-slot-node" data-bind="nodeTitle"></span>
    </td>
    <td>
      <input
        type="text"
        class="rtx-remix-slot-name-input"
        data-bind="exportName"
        data-fields="nodeId,slotName,isInput"
        placeholder=""
        data-bind-placeholder="slotName"
      />
    </td>
    <td>
      <span class="rtx-remix-slot-type" data-bind="comfyuiType"></span>
    </td>
    <td>
      <select class="rtx-remix-slot-type-select" data-fields="nodeId,slotName,isInput">
        <!-- Options populated dynamically -->
      </select>
    </td>
    <td class="rtx-remix-details-cell">
      <button class="rtx-remix-details-btn" type="button">▼</button>
    </td>
  </tr>
</template>
