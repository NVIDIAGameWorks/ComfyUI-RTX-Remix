<!--
  Single group template with all optional cells.
  CSS controls which cells are visible based on container context:
  - Preset panel (.rtx-remix-inputs-list): shows indicator + menu cells
  - Export dialog (.rtx-remix-export-inputs): hides indicator + menu cells
-->
<template id="rtx-remix-grouped-list-group-template">
  <div class="rtx-remix-list-group" data-group-name="">
    <button class="rtx-remix-group-header" data-action="toggle-group" draggable="false" aria-expanded="true">
      <div class="rtx-remix-indicator-cell"></div>
      <div class="rtx-remix-drag-handle-cell">
        <span class="rtx-remix-drag-handle" data-element="group-drag-handle" title="Drag to reorder group">⋮⋮</span>
      </div>
      <div class="rtx-remix-chevron-cell">
        <span class="rtx-remix-group-chevron">▼</span>
      </div>
      <div class="rtx-remix-group-content-cell">
        <span class="rtx-remix-group-name" data-bind="groupName">Group Name</span>
        <span class="rtx-remix-group-count" data-bind="groupCount">(0)</span>
      </div>
      <div class="rtx-remix-menu-cell">
        <span
          class="rtx-remix-group-menu-btn"
          data-action="group-menu"
          title="Group options"
          aria-label="Group options"
        >
          <span class="pi pi-ellipsis-v"></span>
        </span>
      </div>
    </button>
    <div class="rtx-remix-group-items"></div>
  </div>
</template>
