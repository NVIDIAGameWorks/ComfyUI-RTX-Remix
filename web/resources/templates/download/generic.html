<!-- Generic Download Help -->
<template id="rtx-remix-download-generic-info-template">
  <div>
    <p><strong>How to download a model:</strong></p>
    <ol>
      <li>Paste a model URL in the <code>url</code> field</li>
      <li>
        The source will be automatically detected:
        <ul>
          <li><strong>HuggingFace</strong> - URLs from <code>huggingface.co</code></li>
          <li><strong>CivitAI</strong> - URLs from <code>civitai.com</code></li>
          <li><strong>Custom</strong> - Any other direct download link</li>
        </ul>
      </li>
      <li>Additional fields will appear based on the detected source</li>
      <li>The model will be downloaded to the folder matching your selected <code>model_type</code></li>
    </ol>
    <hr style="margin: 12px 0; border: none; border-top: 1px solid #444" />
    <p><strong>Supported URL formats:</strong></p>
    <ul>
      <li><strong>HuggingFace:</strong> <code>https://huggingface.co/{org}/{repo}/blob/main/{file}</code></li>
      <li><strong>CivitAI:</strong> <code>https://civitai.com/models/{id}?modelVersionId={version}</code></li>
      <li><strong>Custom:</strong> Any direct download URL ending with a file extension</li>
    </ul>
    <p><strong>Tips:</strong></p>
    <ul>
      <li>For private/gated models, you'll need to provide an API token/key</li>
      <li>Use <code>Force Download</code> to re-download even if the file exists</li>
      <li>Enable <code>Extract Archive</code> for .zip or .tar files containing models</li>
    </ul>
  </div>
</template>
