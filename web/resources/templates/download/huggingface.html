<!-- HuggingFace Download Info -->
<template id="rtx-remix-download-huggingface-token-info-template">
  <div>
    <p><strong>How to download from HuggingFace:</strong></p>
    <ol>
      <li>
        Go to the model page on HuggingFace (e.g.,
        <a href="https://huggingface.co/stabilityai/sd-vae-ft-mse" target="_blank">stabilityai/sd-vae-ft-mse</a>)
      </li>
      <li>Navigate to <code>Files and versions</code> tab</li>
      <li>Click on the file you want to download (e.g., <code>diffusion_pytorch_model.safetensors</code>)</li>
      <li>Copy the URL from your browser's address bar</li>
      <li>Paste it in the <code>hf_url</code> field - the repo and filename will be auto-filled!</li>
    </ol>
    <p><strong>Supported URL formats:</strong></p>
    <ul>
      <li><code>https://huggingface.co/{org}/{repo}/blob/main/{filename}</code></li>
      <li><code>https://huggingface.co/{org}/{repo}/resolve/main/{filename}</code></li>
    </ul>
    <hr style="margin: 12px 0; border: none; border-top: 1px solid #444" />
    <p><strong>Authentication Token (optional):</strong></p>
    <p>Only needed for private repositories or gated models:</p>
    <ol>
      <li>
        Go to
        <a href="https://huggingface.co/settings/tokens" target="_blank">huggingface.co/settings/tokens</a>
      </li>
      <li>Click <code>New token</code> with <code>Read</code> permissions</li>
      <li>Copy the token (starts with <code>hf_</code>) and paste it in <code>hf_token</code></li>
    </ol>
  </div>
</template>
