<template id="rtx-remix-unsaved-changes-dialog-template">
  <div class="rtx-remix-confirm-overlay">
    <div class="rtx-remix-confirm-dialog">
      <h3 class="rtx-remix-confirm-title">Unsaved Preset Changes</h3>
      <p class="rtx-remix-confirm-message">
        You have unsaved changes to the current preset. Would you like to save or discard them?
      </p>
      <div class="rtx-remix-confirm-actions rtx-remix-confirm-actions-split">
        <button class="rtx-remix-btn rtx-remix-btn-cancel" data-action="cancel">Cancel</button>
        <div class="rtx-remix-confirm-actions-right">
          <button class="rtx-remix-btn rtx-remix-btn-danger" data-action="discard">Discard</button>
          <button class="rtx-remix-btn rtx-remix-btn-primary" data-action="save">Save</button>
        </div>
      </div>
    </div>
  </div>
</template>
