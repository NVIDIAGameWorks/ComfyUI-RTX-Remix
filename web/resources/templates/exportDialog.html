<template id="rtx-remix-export-dialog-template">
  <div class="rtx-remix-overlay">
    <div class="rtx-remix-dialog rtx-remix-dialog-large">
      <!-- Header -->
      <div class="rtx-remix-dialog-header">
        <img class="rtx-remix-dialog-icon" src="" alt="RTX Remix" data-asset="remix-icon" />
        <h2 class="rtx-remix-dialog-title">Export Workflow for RTX Remix</h2>
      </div>

      <!-- Body -->
      <div class="rtx-remix-dialog-body">
        <h3 class="rtx-remix-section-title">Workflow Details</h3>
        <div class="rtx-remix-input-container">
          <label class="rtx-remix-metadata-label" for="rtx-remix-display-name">
            Display Name <span class="rtx-remix-required" title="Required">*</span>
          </label>
          <input
            id="rtx-remix-display-name"
            type="text"
            class="rtx-remix-input"
            placeholder="Generate PBR Textures"
            data-input="display-name"
          />
          <div class="rtx-remix-validation-msg" data-element="display-name-error"></div>
        </div>
        <div class="rtx-remix-input-container">
          <label class="rtx-remix-metadata-label" for="rtx-remix-workflow-type">
            Workflow Type <span class="rtx-remix-required" title="Required">*</span>
          </label>
          <button
            id="rtx-remix-workflow-type"
            type="button"
            class="rtx-remix-input rtx-remix-select"
            data-input="workflow-type"
          >
            <span class="rtx-remix-select-value" data-element="workflow-type-value"></span>
            <span class="rtx-remix-select-caret">&#9662;</span>
          </button>
          <div class="rtx-remix-validation-msg" data-element="workflow-type-error"></div>
        </div>
        <div class="rtx-remix-input-container">
          <label class="rtx-remix-metadata-label" for="rtx-remix-description">Description</label>
          <textarea
            id="rtx-remix-description"
            class="rtx-remix-input"
            rows="3"
            placeholder="Shown as the workflow tooltip in the RTX Remix Toolkit."
            data-input="description"
          ></textarea>
        </div>
        <div class="rtx-remix-validation-msg" data-element="validation"></div>
        <div class="rtx-remix-info-msg" data-element="info">Saved as workflow.json</div>

        <!-- RTX Remix Slots Section -->
        <div class="rtx-remix-slots-section" data-element="slots-section">
          <h3 class="rtx-remix-section-title">Tagged for RTX Remix</h3>
          <div class="rtx-remix-slots-info">
            Configure names and types for your tagged inputs and output nodes.
            <br />
            Drag rows to reorder - order will be preserved in the exported metadata.
          </div>

          <!-- Inputs Table (grouped list populated dynamically) -->
          <div class="rtx-remix-table-wrapper" data-element="inputs-wrapper">
            <h4 class="rtx-remix-table-heading">Inputs</h4>
            <!-- Grouped list table appended by controller -->
          </div>

          <!-- Outputs (flat list populated dynamically) -->
          <div class="rtx-remix-table-wrapper" data-element="outputs-wrapper">
            <h4 class="rtx-remix-table-heading">Outputs</h4>
            <!-- Flat list appended by controller -->
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="rtx-remix-dialog-footer">
        <button class="rtx-remix-btn rtx-remix-btn-cancel" data-action="cancel">Cancel</button>
        <button class="rtx-remix-btn rtx-remix-btn-primary" data-action="export">Export</button>
      </div>
    </div>
  </div>
</template>
